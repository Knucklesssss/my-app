<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無損自動去背</title>
<meta name="description" content="在瀏覽器本機執行 AI 去背，輸出原尺寸、原始像素不變的無損 PNG。圖片不會上傳。">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1d21; --muted: #5d6470;
    --border: #dde1e7; --accent: #2563eb; --accent-text: #ffffff;
    --check-a: #ffffff; --check-b: #e3e6eb; --danger: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121417; --panel: #1b1e23; --text: #e8eaed; --muted: #9aa1ab;
      --border: #2d3139; --accent: #5b8def; --accent-text: #0d1117;
      --check-a: #2a2d33; --check-b: #1f2227; --danger: #ef5350;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  #dropzone {
    border: 2px dashed var(--border); border-radius: 14px; background: var(--panel);
    padding: 36px 16px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  #dropzone:hover, #dropzone:focus-visible, #dropzone.over { border-color: var(--accent); outline: none; }
  #dropzone strong { display: block; font-size: 1.15rem; margin-bottom: 4px; }
  #dropzone span { color: var(--muted); font-size: .92rem; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin: 16px 0 8px; }
  .toolbar label { display: flex; gap: 6px; align-items: center; font-size: .95rem; }
  select, button, input[type=color] {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  }
  input[type=color] { padding: 2px; width: 40px; height: 34px; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .spacer { flex: 1; }
  #status { color: var(--muted); font-size: .92rem; margin: 8px 0 4px; min-height: 1.5em; }
  #progress { width: 100%; height: 8px; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .card.error { border-color: var(--danger); }
  .card.error .info { color: var(--danger); }
  .preview { aspect-ratio: 4 / 3; display: grid; place-items: center; overflow: hidden; }
  .preview canvas { max-width: 100%; max-height: 100%; display: block; }
  .checker {
    background-color: var(--check-a);
    background-image:
      linear-gradient(45deg, var(--check-b) 25%, transparent 25%, transparent 75%, var(--check-b) 75%),
      linear-gradient(45deg, var(--check-b) 25%, transparent 25%, transparent 75%, var(--check-b) 75%);
    background-size: 20px 20px; background-position: 0 0, 10px 10px;
  }
  .meta { padding: 10px 12px 12px; display: grid; gap: 4px; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info { color: var(--muted); font-size: .85rem; }
  .actions { display: flex; gap: 8px; margin-top: 6px; }
  .actions button { flex: 1; font-size: .9rem; touch-action: none; user-select: none; -webkit-user-select: none; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { color: var(--muted); font-size: .82rem; margin-top: 32px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>無損自動去背</h1>
  <p class="lead">AI 自動辨識主體並移除背景。輸出保持原始尺寸，主體像素一個都不改，存成無損 PNG。圖片只在你的裝置上處理，不會上傳。</p>

  <div id="dropzone" role="button" tabindex="0">
    <strong>點這裡選擇圖片</strong>
    <span>或把圖片拖放到頁面、按 Ctrl+V 貼上 · 可一次多張 · 支援 JPG / PNG / WebP</span>
  </div>
  <input id="file" type="file" accept="image/*" multiple hidden>

  <div class="toolbar">
    <label>模型
      <select id="model">
        <option value="medium" selected>高品質（約 88 MB）</option>
        <option value="small">快速（約 44 MB）</option>
      </select>
    </label>
    <label>背景
      <select id="bg">
        <option value="transparent" selected>透明</option>
        <option value="white">白色</option>
        <option value="color">自訂顏色</option>
      </select>
      <input id="bgcolor" type="color" value="#3b82f6" hidden aria-label="背景顏色">
    </label>
    <span class="spacer"></span>
    <button id="clear" type="button" disabled>清除</button>
    <button id="zip" class="primary" type="button" disabled>全部下載（ZIP）</button>
  </div>

  <div id="status" aria-live="polite">選擇或拖放圖片開始。</div>
  <progress id="progress" max="100" value="0" hidden></progress>

  <section id="list" aria-label="處理結果"></section>

  <footer>
    去背模型：<a href="https://github.com/imgly/background-removal-js" target="_blank" rel="noopener">IMG.LY background-removal</a>（AGPL-3.0）。第一次使用會下載模型，之後由瀏覽器快取。
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
